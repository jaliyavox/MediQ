# Render blueprint for MediQ - the API and the web app.
# In Render: New > Blueprint > pick this repo. It reads this file.
#
# Values marked `sync: false` are never stored in the repository; Render
# prompts for them on the first deploy.

services:
  # ---------------------------------------------------------------- API
  - type: web
    name: mediq-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      # app.js allows only localhost:5173 and this origin. Without it the
      # deployed site loads but every API call is blocked by the browser.
      # Set it to the mediq-web URL, with no trailing slash.
      - key: FRONTEND_URL
        sync: false
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

  # ------------------------------------------------------------ web app
  - type: web
    name: mediq-web
    runtime: static
    rootDir: frontend
    # --include=dev is required: vite, tailwindcss and @vitejs/plugin-react are
    # devDependencies, and Render builds with NODE_ENV=production, which would
    # otherwise omit them and fail with "vite: not found".
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: dist
    envVars:
      # Must include the /api suffix - client.js appends /providers, /auth/login
      # and so on to it. Set to https://mediq-api.onrender.com/api
      - key: VITE_API_URL
        sync: false
    routes:
      # Without this, every client-side route (/doctors, /provider/:id, /admin)
      # 404s on direct load or refresh, because Render looks for a file there.
      - type: rewrite
        source: /*
        destination: /index.html
